<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Last Patch — a tiny technician explores an infected laptop and fights the viruses eating it.">
<title>Last Patch</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nosifer&family=Silkscreen&family=JetBrains+Mono:wght@500&display=swap">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:grid;place-items:center}
canvas{display:block;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));image-rendering:auto;outline:none}
.touch{position:fixed;left:0;right:0;bottom:12px;text-align:center;color:#8e96b4;font:12px Silkscreen,monospace;pointer-events:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="cv" width="960" height="540" tabindex="0" aria-label="Last Patch game"></canvas>
<div class="touch" id="touch" hidden>Last Patch needs a keyboard.</div>
<script src="achievements.js"></script>
<script src="lp-engine.js"></script>
<script src="lp-world.js"></script>
<script src="lp-bosses.js"></script>
<script>
(function(){
'use strict';
const LP=window.LP,T=LP.T,VW=LP.VW,VH=LP.VH,H=LP.H,I=LP.I,{clamp,rand,pick,lerp,appr}=LP;
const cv=document.getElementById('cv'),g=cv.getContext('2d');
if(matchMedia('(pointer:coarse)').matches)document.getElementById('touch').hidden=false;
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(r.width*d)||VW;cv.height=Math.round(r.height*d)||VH}
addEventListener('resize',fit);fit();
const MODES={normal:{n:'NORMAL',hearts:3,nm:false,d:'Three hearts. Still hard.'},nightmare:{n:'NIGHTMARE',hearts:3,nm:true,d:'Three hearts. Enemies and bosses stop being predictable.'},impossible:{n:'IMPOSSIBLE',hearts:1,nm:true,d:'One heart. Nightmare enemies. Die once and the run is deleted.'}};
const MODE_KEYS=['normal','nightmare','impossible'];
let state='title',mode=LP.store.get('lc-lp-mode')||'normal',menuI=0,sub=null,overT=0,deadT=0,loreBox=null,abilCard=null,endCard=null;
LP.save=null;LP.roomT=0;LP.cs=null;LP.boss=null;

/* ---------- saves ---------- */
const SK=m=>'lc-lp-'+m;
function loadSave(m){try{const v=JSON.parse(LP.store.get(SK(m))||'null');return v&&v.v===1?v:null}catch(e){return null}}
LP.saveGame=()=>{if(LP.save)LP.store.set(SK(LP.save.mode),JSON.stringify(LP.save))};
function newSave(m){return{v:1,mode:m,room:null,x:0,y:0,abil:{},boss:{},seen:{},cs:{},time:0,deaths:0,intro:false}}

/* ---------- cutscene runner ---------- */
LP.runCS=gen=>{LP.cs={it:gen,wait:0,cond:null}};
function csStep(dt){const c=LP.cs;if(!c)return;if(c.wait>0){c.wait-=dt;return}if(c.cond){if(!c.cond())return;c.cond=null}const r=c.it.next();if(r.done){LP.cs=null;H.ctrl=true;return}
  if(typeof r.value==='number')c.wait=r.value-dt;else if(typeof r.value==='function')c.cond=r.value}

/* ---------- rooms ---------- */
let curZone=null;
function enterRoom(id,x,y,opts){opts=opts||{};const r=LP.rooms[id];LP.room=r;if(!r.canvas)LP.buildRoomCanvas(r);
  for(let i=0;i<r.grid.length;i++)if(r.grid[i]===5)r.grid[i]=0;
  LP.zoomFX=null;LP.plats=[];LP.shots=[];LP.parts.length=0;LP.boss=null;LP.ents=r.spawns.map(LP.spawn).filter(Boolean);LP.roomT=0;
  H.x=x;H.y=y;H.lastSafe={x,y};H.after=[];H.onPlat=null;H.scarf.forEach(p=>{p.x=p.px=x+9;p.y=p.py=y+8});
  LP.save.seen[id]=1;if(r.zone!==curZone){curZone=r.zone;const Z=LP.ZONES[r.zone];if(!opts.quiet)LP.banner(Z.name,Z.sub.toUpperCase());LP.music(Z.music)}
  LP.camUpdate(0,true);LP.fade={t:0,d:.22,inOnly:true}}
LP.enterRoom=enterRoom;
function checkExit(){const r=LP.room,cx=H.x+H.w/2,cy=H.y+H.h/2;if(cx>=0&&cy>=0&&cx<r.w*T&&cy<r.h*T)return;
  const wx=r.wx*T+cx,wy=r.wy*T+cy,nr=LP.roomAtWorld(Math.floor(wx/T),Math.floor(wy/T));
  if(!nr||nr===r){H.x=clamp(H.x,0,r.w*T-H.w);H.y=clamp(H.y,-40,r.h*T-H.h);return}
  const vx=H.vx,vy=H.vy;enterRoom(nr.id,wx-nr.wx*T-H.w/2,wy-nr.wy*T-H.h/2);H.vx=vx;H.vy=vy}

/* ---------- hooks ---------- */
LP.rest=sp=>{H.hearts=LP.maxHearts;H.vx=0;LP.save.room=LP.room.id;LP.save.x=sp.x;LP.save.y=sp.y;LP.saveGame();LP.sfx('save');
  LP.part({x:sp.x,y:sp.y-20,k:'ring',col:'#46f08f',s:10,grow:300,life:.6});LP.burst(sp.x,sp.y-20,20,'#46f08f',200,{g:-80});LP.text(sp.x,sp.y-70,'PROGRESS SAVED','#bfffd8',{s:12,life:1.4,vy:-30});
  LP.ents=LP.ents.filter(e=>!e.enemy).concat(LP.room.spawns.filter(s=>LP.EN[s.type]).map(LP.spawn))};
LP.showLore=txt=>{state='lore';loreBox={txt,t:0};LP.sfx('ui')};
LP.getAbility=(ab,shrine)=>{if(LP.abil[ab])return;LP.runCS((function*(){H.ctrl=false;H.vx=0;LP.sfx('ability');LP.flash={c:'rgba(255,240,190,',t:.6,m:.9};
  for(let s=0;s<1.1;s+=LP.DT){H.vy=-30;if(Math.random()<.8){const a=rand(0,6.283);LP.part({x:H.x+9+Math.cos(a)*90,y:H.y+20+Math.sin(a)*90,vx:-Math.cos(a)*200,vy:-Math.sin(a)*200,life:.45,col:'#ffd36b',s:3,k:'spark'})}yield LP.DT}
  LP.abil[ab]=1;LP.save.abil=LP.abil;LP.saveGame();LP.part({x:H.x+9,y:H.y+20,k:'ring',col:'#ffd36b',s:10,grow:700,life:.6,w:5});LP.shake(10);
  state='ability';abilCard={ab,t:0};yield()=>state==='play';H.ctrl=true})())};
LP.startBoss=id=>{const b=LP.BOSSES[id]();LP.boss=b;const full=!LP.save.cs[id];LP.save.cs[id]=1;LP.saveGame();LP.runCS(LP.INTROS[id](b,full))};
LP.bossDefeated=b=>{LP.save.boss[b.id]=1;LP.saveGame();if(window.LCAch&&!LP.devUsed)LCAch.unlock('lp_'+b.id);
  setTimeout(()=>{if(LP.boss===b){LP.boss=null;const gt=LP.ents.find(e=>e.kind==='gate');gt&&gt.open();LP.titleCard('INFECTION PURGED',b.name,2.6);LP.music(LP.ZONES[LP.room.zone].music)}},1300)};
LP.onHurt=()=>{};
const killHero0=LP.killHero;LP.killHero=()=>{killHero0();LP.save.deaths++;const b=LP.boss;if(b&&b.id==='weaver'&&b.state!=='dying')setTimeout(()=>LP.mwahaha(b,.85,false,{x:b.x,y:b.y}),500)};

/* ---------- game flow ---------- */
function startGame(m,cont){mode=m;LP.store.set('lc-lp-mode',m);const M=MODES[m];LP.NM=M.nm;LP.maxHearts=M.hearts;
  LP.save=cont?loadSave(m):newSave(m);if(!cont)LP.saveGame();LP.abil=LP.save.abil;curZone=null;LP.overlays.length=0;LP.cs=null;LP.darkOverride=null;LP.cam.focus=null;
  LP.heroReset(0,0);H.hearts=LP.maxHearts;H.charge=0;state='play';
  if(!cont||!LP.save.room){const s=LP.START;enterRoom(s.room,s.x,s.y-200,{quiet:true});LP.runCS(intro())}
  else{enterRoom(LP.save.room,LP.save.x-9,LP.save.y-40)}}
function* intro(){H.ctrl=false;H.frozen=true;LP.darkOverride=.85;H.y=-400;H.vy=0;LP.music('quiet');
  LP.console(['> usb0: device connected','> mounting patch.exe ............. ok','> target: everything that is eating this machine','> deploying technician'],40);yield 4.4;
  LP.darkOverride=null;LP.flash={c:'rgba(160,240,255,',t:.4,m:.8};LP.sfx('zap');H.y=66;H.x=LP.START.x;H.vy=500;H.frozen=false;for(let i=0;i<30;i++)LP.part({x:H.x+9,y:rand(0,120),vx:rand(-20,20),vy:rand(200,500),life:.6,col:'#3ee8ff',s:2,k:'spark'});
  yield()=>H.ground;LP.shake(10);LP.dust(14);yield .6;LP.banner('THE MOTHERBOARD','COPPER COUNTRY');LP.music('mb');LP.save.intro=true;LP.saveGame();curZone='mb'}
function respawn(){LP.cs=null;LP.overlays.length=0;LP.darkOverride=null;LP.cam.focus=null;LP.boss=null;const s=LP.save;H.hearts=LP.maxHearts;
  if(s.room){LP.heroReset(s.x-9,s.y-40);H.hearts=LP.maxHearts;curZone=null;enterRoom(s.room,s.x-9,s.y-40)}else{LP.heroReset(0,0);H.hearts=LP.maxHearts;curZone=null;enterRoom(LP.START.room,LP.START.x,LP.START.y,{})}H.charge=Math.min(H.charge,33);state='play'}

/* ---------- combat ---------- */
function onHit(dir){H.charge=Math.min(99,H.charge+11);LP.stop(.045);LP.shake(3);if(H.atkDir==='d')LP.pogo();else if(H.atkDir==='f')H.vx-=H.face*(H.ground?160:60)}
function combat(dt){const ab=LP.atkBox(),hb=LP.heroBox();
  if(ab){for(const e of LP.ents)if(e.enemy&&!e.dead&&!H.atkHit.has(e)&&LP.overlap(ab,e)){H.atkHit.add(e);e.hurt(1,H.atkDir==='f'?H.face:Math.sign(e.x-H.x)||1);onHit()}
    if(LP.boss)for(const box of LP.boss.hitboxes()){const key=box.copy||LP.boss;if(!H.atkHit.has(key)&&LP.overlap(ab,box)){H.atkHit.add(key);if(LP.boss.hurt(1,H.face,box))onHit()}}
    for(const s of LP.shots)if(!s.mine&&s.brk&&!s.dead&&LP.overlap(ab,{x:s.x-s.r,y:s.y-s.r,w:s.r*2,h:s.r*2})){s.dead=true;H.charge=Math.min(99,H.charge+4);LP.burst(s.x,s.y,10,s.col,250);LP.sfx('hit')}}
  if(!H.dead&&!LP.cs){for(const e of LP.ents)if(e.enemy&&!e.dead&&LP.overlap(hb,{x:e.x+3,y:e.y+3,w:e.w-6,h:e.h-6}))LP.hurtHero(e.x+e.w/2,1);
    if(LP.boss){for(const c of LP.boss.contact())if(LP.overlap(hb,c))LP.hurtHero(c.x+c.w/2,1);for(const z of LP.boss.haz)if(z.on&&LP.overlap(hb,z))LP.hurtHero(z.x+z.w/2,1)}}
  for(const s of LP.shots){if(s.dead)continue;s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.life<=0){s.dead=true;continue}
    if(LP.solidAt(s.x,s.y)){s.dead=true;LP.burst(s.x,s.y,8,s.col,200);continue}
    const box={x:s.x-s.r,y:s.y-s.r,w:s.r*2,h:s.r*2};
    if(s.mine){if(Math.random()<.9)LP.part({x:s.x,y:s.y,vx:-s.vx*.1,vy:rand(-20,20),life:.25,col:'#3ee8ff',s:3});
      for(const e of LP.ents)if(e.enemy&&!e.dead&&!s.hit.has(e)&&LP.overlap(box,e)){s.hit.add(e);e.hurt(s.dmg,Math.sign(s.vx));LP.burst(s.x,s.y,12,'#3ee8ff',300)}
      if(LP.boss)for(const b of LP.boss.hitboxes()){const key=b.copy||LP.boss;if(!s.hit.has(key)&&LP.overlap(box,b)){s.hit.add(key);LP.boss.hurt(s.dmg,Math.sign(s.vx),b);s.dead=true;LP.burst(s.x,s.y,14,'#3ee8ff',300)}}}
    else if(!H.dead&&!LP.cs&&LP.overlap(hb,{x:s.x-s.r+2,y:s.y-s.r+2,w:s.r*2-4,h:s.r*2-4})){s.dead=true;LP.hurtHero(s.x,1)}}
  LP.shots=LP.shots.filter(s=>!s.dead);LP.ents=LP.ents.filter(e=>!e.dead)}

/* ---------- step ---------- */
function step(dt){LP.t+=dt;
  for(const o of LP.overlays){o.t+=dt;o.update&&o.update(dt)}LP.overlays=LP.overlays.filter(o=>o.t<o.life);
  if(LP.flash){LP.flash.t-=dt;if(LP.flash.t<=0)LP.flash=null}if(LP.fade){LP.fade.t+=dt;if(LP.fade.t>=LP.fade.d)LP.fade=null}
  if(state==='title'){titleStep(dt);return}
  if(state==='console'){LP.updParts&&0;return}
  if(state==='pause'||state==='map'){menuStep();return}
  if(state==='lore'){loreBox.t+=dt;if(loreBox.t>.3&&(I.hit.down||I.hit.attack||I.hit.confirm||I.hit.jump||I.hit.pause)){state='play';loreBox=null}return}
  if(state==='ability'){abilCard.t+=dt;if(abilCard.t>1&&(I.hit.attack||I.hit.confirm)){state='play';const ab=abilCard.ab;abilCard=null;if(ab==='grip'){state='end';endCard={t:0}}}return}
  if(state==='end'){endCard.t+=dt;if(endCard.t>1.2&&(I.hit.attack||I.hit.confirm)){state='play';endCard=null}return}
  if(state==='over'){overT+=dt;if(overT>1.2&&(I.hit.confirm||I.hit.attack))toTitle();return}
  if(state==='dead'){deadT+=dt;LP.updParts(dt);if(deadT>1.8)respawn();return}
  // play
  if(I.hit.pause&&!LP.cs){state='pause';menuI=0;LP.sfx('ui');return}
  if(I.hit.map&&!LP.cs){state='map';LP.sfx('ui');return}
  if(LP.hitstop>0){LP.hitstop-=dt;return}
  LP.roomT+=dt;LP.save.time+=dt;csStep(dt);
  for(const e of LP.ents)if(!e.enemy)e.update(dt);
  LP.heroUpdate(dt);
  for(const e of LP.ents)if(e.enemy&&!e.dead)e.update(dt);
  if(LP.boss)LP.boss.update(dt);
  combat(dt);LP.updParts(dt);if(!H.dead&&!LP.cs)checkExit();LP.camUpdate(dt);
  if(H.dead&&H.deadT>1.3){if(mode==='impossible'){state='over';overT=0;LP.store.del(SK('impossible'));const best=+(LP.store.get('lc-lp-best-imp')||0),n=Object.keys(LP.save.boss).length;if(n>best)LP.store.set('lc-lp-best-imp',n);LP.stopMusic()}else{state='dead';deadT=0}}}

/* ---------- drawing ---------- */
function drawActors(g,layer){for(const e of LP.ents)if(!e.enemy&&(e.layer||'mid')===layer)e.draw(g);
  if(layer==='mid'){for(const e of LP.ents)if(e.enemy)e.draw(g);if(LP.boss)LP.boss.draw(g);LP.heroDraw(g);
    for(const s of LP.shots){if(s.mine){g.save();g.translate(s.x,s.y);g.rotate(Math.atan2(s.vy,s.vx));g.shadowColor='#3ee8ff';g.shadowBlur=16;g.fillStyle='#dffcff';g.fillRect(-12,-4,24,8);g.fillStyle='#3ee8ff';g.fillRect(-18,-2,8,4);g.restore()}
      else{g.fillStyle=s.col;g.shadowColor=s.col;g.shadowBlur=12;g.beginPath();g.arc(s.x,s.y,s.r,0,6.283);g.fill();g.shadowBlur=0;g.fillStyle='#fff';g.beginPath();g.arc(s.x,s.y,s.r*.4,0,6.283);g.fill()}LP.light(s.x,s.y,50,.5)}}}
function heart(g,x,y,s,full,t){g.save();g.translate(x,y);g.scale(s,s);g.beginPath();g.moveTo(0,6);g.bezierCurveTo(-14,-4,-9,-14,0,-7);g.bezierCurveTo(9,-14,14,-4,0,6);g.closePath();
  if(full){g.fillStyle='#ff4f6b';g.shadowColor='#ff4f6b';g.shadowBlur=10;g.fill();g.shadowBlur=0;g.fillStyle='#ffd0d8';g.fillRect(-6,-7,3,3);g.strokeStyle='#8a1a30';g.lineWidth=1;g.beginPath();g.moveTo(-4,0);g.lineTo(0,-3);g.lineTo(4,0);g.stroke()}
  else{g.strokeStyle='rgba(255,120,140,.5)';g.lineWidth=1.5;g.stroke()}g.restore()}
function hud(g){const t=LP.t;// charge orb
  const ox=46,oy=46,r=26,c=H.charge/99;g.fillStyle='rgba(5,8,16,.7)';g.beginPath();g.arc(ox,oy,r+4,0,6.283);g.fill();
  g.save();g.beginPath();g.arc(ox,oy,r,0,6.283);g.clip();const lvl=oy+r-c*r*2;g.fillStyle='#1d6f8a';g.beginPath();g.moveTo(ox-r,oy+r);for(let x=-r;x<=r;x+=4)g.lineTo(ox+x,lvl+Math.sin(t*4+x*.2)*2.5);g.lineTo(ox+r,oy+r);g.fill();
  g.fillStyle='rgba(62,232,255,.55)';g.fillRect(ox-r,lvl-2,r*2,3);g.restore();g.strokeStyle=H.charge>=33?'#7df0ff':'#3a4a6a';g.lineWidth=2.5;g.beginPath();g.arc(ox,oy,r,0,6.283);g.stroke();
  for(const k of[33,66]){const yy=oy+r-k/99*r*2;g.fillStyle='rgba(255,255,255,.35)';g.fillRect(ox-r+3,yy,6,1.5)}
  for(let i=0;i<LP.maxHearts;i++)heart(g,92+i*32,40,1.3,i<H.hearts,t);
  g.font='10px Silkscreen,monospace';g.fillStyle=mode==='normal'?'rgba(200,210,240,.55)':mode==='nightmare'?'#c45bff':'#ff4f6b';g.fillText(MODES[mode].n,84,70);
  const ab=['dash','shot','grip'].filter(a=>LP.abil[a]);ab.forEach((a,i)=>{g.fillStyle='rgba(255,211,107,.85)';g.fillText({dash:'SHIFT DASH',shot:'E SHOT',grip:'WALL GRIP'}[a],84+i*92,86)});
  if(LP.boss&&LP.boss.state!=='form'&&LP.boss.state!=='ceiling'&&!LP.boss.dead){const b=LP.boss,w=520,x=(VW-w)/2,y=VH-44;g.fillStyle='rgba(5,8,16,.75)';g.fillRect(x-10,y-22,w+20,40);
    g.font='13px Silkscreen,monospace';g.fillStyle='#fff';g.textAlign='center';g.fillText(b.name,VW/2,y-6);g.textAlign='left';g.fillStyle='#2a1020';g.fillRect(x,y,w,8);
    b.shown=b.shown==null?b.hp:appr(b.shown,b.hp,b.max*LP.DT*.8);g.fillStyle='#ffd0d8';g.fillRect(x,y,w*b.shown/b.max,8);g.fillStyle='#ff3e6b';g.fillRect(x,y,w*b.hp/b.max,8);g.fillStyle='rgba(0,0,0,.6)';g.fillRect(x+w/2-1,y,2,8)}}
function textBox(g,lines,y,h){const w=640,x=(VW-w)/2;g.fillStyle='rgba(4,7,14,.92)';g.fillRect(x,y,w,h);g.strokeStyle='rgba(125,200,255,.5)';g.lineWidth=1.5;g.strokeRect(x+.5,y+.5,w-1,h-1)}
function render(){const s=cv.width/VW;g.setTransform(s,0,0,cv.height/VH,0,0);
  if(state==='title'){titleDraw(g);return}
  LP.renderWorld(g,drawActors);
  if(LP.zoomFX){const z=LP.zoomFX;z.t+=1/60;if(z.t>=z.life)LP.zoomFX=null;else{const e=Math.min(LP.ease.out(Math.min(1,z.t/.4)),LP.ease.inOut(Math.min(1,(z.life-z.t)/.5)));const k=1+(z.z-1)*e;
    if(k>1.002){const cw=cv.width,ch=cv.height,sc=cw/VW,fx=(z.x-LP.cam.x)*sc,fy=(z.y-LP.cam.y)*sc,sw=cw/k,sh=ch/k,sx=clamp(fx-sw/2,0,cw-sw),sy=clamp(fy-sh/2,0,ch-sh);g.save();g.setTransform(1,0,0,1,0,0);g.drawImage(cv,sx,sy,sw,sh,0,0,cw,ch);g.restore()}}}
  for(const o of LP.overlays)o.draw(g,o.t);
  // letterbox
  LP.lb=appr(LP.lb||0,LP.cs?1:0,LP.DT*3);if(LP.lb>0){g.fillStyle='#000';g.fillRect(0,0,VW,46*LP.lb);g.fillRect(0,VH-46*LP.lb,VW,46*LP.lb)}
  if(!LP.cs||LP.boss)hud(g);
  if(LP.flash){g.fillStyle=LP.flash.c+(LP.flash.m*Math.min(1,LP.flash.t/.3))+')';g.fillRect(0,0,VW,VH)}
  if(LP.fade){const k=LP.fade.t/LP.fade.d;g.fillStyle=`rgba(0,0,0,${LP.fade.inOnly?1-k:k<.5?k*2:2-k*2})`;g.fillRect(0,0,VW,VH)}
  if(H.hazT>0){g.fillStyle=`rgba(0,0,0,${1-Math.abs(H.hazT-.25)/.25})`;g.fillRect(0,0,VW,VH)}
  if(state==='lore')loreDraw(g);if(state==='ability')abilDraw(g);if(state==='end')endDraw(g);if(state==='pause')pauseDraw(g);if(state==='map')mapDraw(g);
  if(state==='dead')deadDraw(g);if(state==='over')overDraw(g);if(state==='console')conDraw(g)}
function loreDraw(g){g.font='15px "JetBrains Mono",monospace';const L=[];loreBox.txt.split('\n').forEach((para,pi)=>{let line='';for(const w of para.split(' ')){const tt=line?line+' '+w:w;if(g.measureText(tt).width>588&&line){L.push([line,pi]);line=w}else line=tt}L.push([line,pi])});
  const h=Math.max(150,L.length*26+70);textBox(g,null,VH-h-46,h);let k=Math.floor(loreBox.t*60);
