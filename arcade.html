<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="LC Arcade — nine retro games by Lucas Chiang. Four solo, five for two players on one keyboard.">
<title>LC Arcade</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* One committed look: an arcade cabinet in a dark room. Neon marquee, CRT glass, cartridge slots. */
:root{
  --bg:#07060d; --panel:#110f1d; --panel2:#181530; --fg:#f2f0ff; --muted:#9a96b8; --line:#2a2546;
  --cyan:#3ee8ff; --pink:#ff4fb3; --amber:#ffc23e; --green:#46f08f; --red:#ff5b6b; --violet:#a98bff;
  --pixel:"Press Start 2P",ui-monospace,monospace; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --body:"Figtree",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(ellipse at 50% -10%,#2a1446 0%,transparent 55%),radial-gradient(ellipse at 50% 120%,#0d2a3a 0%,transparent 50%),var(--bg);min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px}
.top .sp{flex:1}
.lnk{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:4px;text-decoration:none;font:500 .78rem var(--mono);color:var(--muted);background:rgba(17,15,29,.7)}
.lnk:hover{color:var(--fg);border-color:var(--cyan)}
.brand{font:400 .7rem var(--pixel);letter-spacing:.06em;text-decoration:none;color:var(--muted)}

/* marquee */
.marquee{margin:18px auto 8px;text-align:center;position:relative}
.marquee h1{margin:0;font:400 clamp(1.6rem,6vw,3.6rem)/1.15 var(--pixel);letter-spacing:.04em;color:#fff;
  text-shadow:0 0 6px var(--pink),0 0 18px var(--pink),0 0 42px rgba(255,79,179,.6),4px 4px 0 #3a0f2e}
.marquee h1 span{color:#fff;text-shadow:0 0 6px var(--cyan),0 0 18px var(--cyan),0 0 42px rgba(62,232,255,.6),4px 4px 0 #0b2b33}
.marquee p{margin:16px 0 0;font:500 .82rem var(--mono);color:var(--muted);letter-spacing:.06em}
.flick{animation:flick 6s infinite}
@keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.55}98%{opacity:1}99%{opacity:.7}}
@media (prefers-reduced-motion: reduce){.flick{animation:none}}

/* mode picker */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:30px auto 0;max-width:780px}
.mode{all:unset;cursor:pointer;position:relative;padding:26px 24px 24px;border:2px solid var(--c);border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 12%,var(--panel)),var(--panel));
  box-shadow:0 0 0 4px rgba(0,0,0,.4),0 0 30px color-mix(in srgb,var(--c) 25%,transparent);transition:transform .15s,box-shadow .15s;overflow:hidden}
.mode:hover,.mode:focus-visible{transform:translateY(-4px);box-shadow:0 0 0 4px rgba(0,0,0,.4),0 0 44px color-mix(in srgb,var(--c) 45%,transparent)}
.mode:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
.mode .k{font:400 .6rem var(--pixel);color:var(--c);letter-spacing:.1em}
.mode h2{margin:10px 0 8px;font:400 clamp(1rem,2.6vw,1.35rem)/1.3 var(--pixel);color:#fff}
.mode p{margin:0;color:var(--muted);font-size:.92rem}
.mode .go{display:inline-block;margin-top:16px;font:400 .62rem var(--pixel);padding:10px 14px;background:var(--c);color:#0a0812;border-radius:4px}
.mode .players{position:absolute;right:18px;top:18px;display:flex;gap:6px}
.mode .players i{width:16px;height:22px;background:var(--c);clip-path:polygon(30% 0,70% 0,70% 30%,100% 30%,100% 100%,0 100%,0 30%,30% 30%);opacity:.85}
@media (max-width:640px){.modes{grid-template-columns:1fr}}

/* game grid */
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 16px}
.sec-h h2{margin:0;font:400 clamp(.9rem,2.4vw,1.2rem) var(--pixel);color:#fff}
.sec-h p{margin:0;color:var(--muted);font:500 .78rem var(--mono)}
.sec-h .sp{flex:1}
.grid{display:grid;gap:16px;margin:0 auto}
.grid.solo{grid-template-columns:repeat(2,minmax(0,1fr));max-width:860px}
.grid.duo{grid-template-columns:repeat(6,minmax(0,1fr))}
.grid.duo .cart{grid-column:span 2}.grid.duo .cart:nth-child(4){grid-column:2 / span 2}
@media (max-width:900px){.grid.duo{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.duo .cart,.grid.duo .cart:nth-child(4){grid-column:auto}}
@media (max-width:600px){.grid.solo,.grid.duo{grid-template-columns:1fr}}
.cart{all:unset;cursor:pointer;display:flex;flex-direction:column;border-radius:10px;background:var(--panel);border:1.5px solid var(--line);overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative}
.cart:hover,.cart:focus-visible{transform:translateY(-3px);border-color:var(--c);box-shadow:0 0 28px color-mix(in srgb,var(--c) 30%,transparent)}
.cart:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.cart .shot{position:relative;aspect-ratio:800/560;background:#000;border-bottom:1.5px solid var(--line)}
.cart canvas{width:100%;height:100%;display:block}
.cart .shot::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}
.cart .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.cart h3{margin:0;font:400 .72rem/1.5 var(--pixel);color:#fff}
.cart .d{color:var(--muted);font-size:.86rem}
.cart .ctl{font:500 .7rem var(--mono);color:var(--c);letter-spacing:.03em}
.cart .best{position:absolute;top:8px;right:8px;font:500 .62rem var(--mono);background:rgba(7,6,13,.85);border:1px solid var(--c);color:var(--c);padding:3px 7px;border-radius:3px}
.cart .notch{position:absolute;top:0;left:50%;width:46px;height:8px;margin-left:-23px;background:var(--bg);border-radius:0 0 6px 6px}
.back{all:unset;cursor:pointer;font:400 .6rem var(--pixel);padding:10px 14px;border:1.5px solid var(--line);border-radius:4px;color:var(--muted)}
.back:hover{color:#fff;border-color:var(--cyan)}.back:focus-visible{outline:2px solid var(--amber)}

/* cabinet / game view */
.cab{margin:10px auto 0;max-width:min(1000px,calc((100vh - 170px) * 1.4286 + 40px));}
.cab-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cab-bar h2{margin:0;font:400 clamp(.75rem,2vw,1rem) var(--pixel);color:#fff}
.cab-bar .st{margin-left:auto;font:500 .8rem var(--mono);color:var(--amber);font-variant-numeric:tabular-nums}
.bezel{position:relative;padding:18px;border-radius:22px;background:linear-gradient(160deg,#221d3c,#0e0c1a);box-shadow:inset 0 0 0 2px #2f2852,0 20px 60px rgba(0,0,0,.6),0 0 60px color-mix(in srgb,var(--c,#3ee8ff) 18%,transparent)}
.screen{position:relative;aspect-ratio:800/560;border-radius:14px;overflow:hidden;background:#000;box-shadow:inset 0 0 40px rgba(0,0,0,.9)}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55));}
.ovl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;background:rgba(5,4,12,.66);backdrop-filter:blur(2px);z-index:2}
.ovl h3{margin:0 0 10px;font:400 clamp(1rem,3.6vw,1.8rem)/1.4 var(--pixel);color:#fff;text-shadow:0 0 14px var(--c,#3ee8ff)}
.ovl p{margin:0 auto 14px;max-width:46ch;color:#d6d2f0;font-size:.95rem}
.ovl .keys{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 18px}
.ovl .keys span{font:500 .72rem var(--mono);border:1px solid var(--line);background:rgba(17,15,29,.8);padding:4px 9px;border-radius:4px;color:var(--fg)}
.btn{all:unset;cursor:pointer;font:400 .62rem var(--pixel);padding:12px 16px;border-radius:4px;background:var(--c,#3ee8ff);color:#0a0812;margin:0 4px}
.btn.alt{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.blink{animation:none}}
.hint{margin-top:10px;text-align:center;font:500 .72rem var(--mono);color:var(--muted)}
.touch-note{margin-top:8px;text-align:center;font:500 .74rem var(--mono);color:var(--amber)}
.foot{margin:40px 0 24px;text-align:center;font:500 .7rem var(--mono);color:#5f5a80}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#" id="homeLink">LC ARCADE</a><span class="sp"></span>
    <a class="lnk" href="board.html">3D Board</a><a class="lnk" href="fun.html">Fun site</a><a class="lnk" href="index.html">Classic site</a>
  </header>

  <!-- HOME -->
  <section id="vHome">
    <div class="marquee"><h1 class="flick">LC <span>ARCADE</span></h1><p>NINE CARTRIDGES · ONE KEYBOARD · INSERT COIN</p></div>
    <div class="modes">
      <button class="mode" type="button" data-mode="solo" style="--c:var(--cyan)"><span class="players"><i></i></span><div class="k">1 PLAYER</div><h2>Single Player</h2><p>Paddle Ball vs AI · Star Sweeper · Snake · Brick Blitz</p><span class="go">PLAY SOLO</span></button>
      <button class="mode" type="button" data-mode="duo" style="--c:var(--pink)"><span class="players"><i></i><i></i></span><div class="k">2 PLAYERS</div><h2>Two Player</h2><p>Four in a Row · Paddle Ball · Kart Racer · Air Hockey · Trail Riders</p><span class="go">PLAY TOGETHER</span></button>
    </div>
  </section>

  <!-- GAME LIST -->
  <section id="vList" hidden>
    <div class="sec-h"><button class="back" type="button" data-nav="home">← BACK</button><h2 id="listTitle"></h2><p id="listSub"></p></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- GAME -->
  <section id="vGame" hidden>
    <div class="cab">
      <div class="cab-bar"><button class="back" type="button" id="gBack">← MENU</button><h2 id="gTitle"></h2><span class="st" id="gStatus"></span></div>
      <div class="bezel" id="bezel"><div class="screen"><canvas id="cv" width="800" height="560" aria-label="Game screen"></canvas>
        <div class="ovl" id="ovl"><div><h3 id="oTitle"></h3><p id="oText"></p><div class="keys" id="oKeys"></div><div id="oBtns"></div></div></div></div></div>
      <div class="hint" id="gHint">Esc pauses · P pauses · M returns to the menu</div>
      <div class="touch-note" id="touchNote" hidden>Two-player games need a keyboard.</div>
    </div>
  </section>
  <div class="foot">LC ARCADE · ported from Lucas Chiang’s Python arcade hub</div>
</div>

<script>
(function(){
'use strict';
const W=800,H=560,$=s=>document.querySelector(s);
const coarse=matchMedia('(pointer: coarse)').matches;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const C={cyan:'#3ee8ff',pink:'#ff4fb3',amber:'#ffc23e',green:'#46f08f',red:'#ff5b6b',violet:'#a98bff',fg:'#f2f0ff',muted:'#9a96b8'};
function glowRect(g,x,y,w,h,col,b){g.save();g.shadowColor=col;g.shadowBlur=b==null?14:b;g.fillStyle=col;g.fillRect(x,y,w,h);g.restore()}
function glowCirc(g,x,y,r,col,b){g.save();g.shadowColor=col;g.shadowBlur=b==null?16:b;g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,6.283);g.fill();g.restore()}
function txt(g,s,x,y,sz,col,al,font){g.font=`${sz}px ${font||'"Press Start 2P",monospace'}`;g.fillStyle=col;g.textAlign=al||'center';g.textBaseline='middle';g.fillText(s,x,y);g.textAlign='left';g.textBaseline='alphabetic'}
function rr(g,x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}

/* ================= GAMES ================= */
const G={};

/* ---------- Paddle Ball (vs AI / 2P) ---------- */
function paddleBall(vsAI){return{
  title:vsAI?'Paddle Ball':'Paddle Ball 2P',color:C.cyan,
  keys:vsAI?['↑ ↓ or W S','Mouse / touch','First to 7']:['P1: W S','P2: ↑ ↓','First to 7'],
  desc:vsAI?'Rally against the CPU paddle. The ball speeds up with every hit.':'Left vs right on one keyboard. First to seven.',
  init(){this.PW=14;this.PH=90;this.BS=14;this.p1=H/2-45;this.p2=H/2-45;this.s=[0,0];this.trail=[];this.serve(pick([-1,1]))},
  serve(d){this.bx=W/2;this.by=H/2;this.vx=6*d;this.vy=pick([-4,-3,3,4]);this.wait=40},
  step(k,api){const sp=9;if(vsAI){if(k.has('ArrowUp')||k.has('KeyW'))this.p1-=sp;if(k.has('ArrowDown')||k.has('KeyS'))this.p1+=sp;if(this.ptr!=null)this.p1+=(this.ptr-this.PH/2-this.p1)*.35;
      const t=this.by-this.PH/2+(this.vx>0?0:(H/2-this.by)*.5);if(Math.abs(t-this.p2)>5.5)this.p2+=t>this.p2?5.5:-5.5}
    else{if(k.has('KeyW'))this.p1-=sp;if(k.has('KeyS'))this.p1+=sp;if(k.has('ArrowUp'))this.p2-=sp;if(k.has('ArrowDown'))this.p2+=sp}
    this.p1=clamp(this.p1,0,H-this.PH);this.p2=clamp(this.p2,0,H-this.PH);
    if(this.wait>0){this.wait--;return}
    this.bx+=this.vx;this.by+=this.vy;this.trail.push([this.bx,this.by]);if(this.trail.length>12)this.trail.shift();
    if(this.by<=0||this.by>=H-this.BS){this.vy*=-1;this.by=clamp(this.by,0,H-this.BS);api.sfx('wall')}
    const hit=(py,dir)=>{const off=((this.by+this.BS/2)-(py+this.PH/2))/(this.PH/2);this.vx=dir*Math.min(15,Math.abs(this.vx)*1.05);this.vy=clamp(this.vy+off*3.2,-11,11);api.sfx('hit')};
    if(this.vx<0&&this.bx<=30+this.PW&&this.bx>=14&&this.by+this.BS>=this.p1&&this.by<=this.p1+this.PH){this.bx=30+this.PW;hit(this.p1,1)}
    if(this.vx>0&&this.bx+this.BS>=W-30-this.PW&&this.bx<=W-14&&this.by+this.BS>=this.p2&&this.by<=this.p2+this.PH){this.bx=W-30-this.PW-this.BS;hit(this.p2,-1)}
    if(this.bx<-20){this.s[1]++;api.sfx('point');this.serve(1)}else if(this.bx>W+20){this.s[0]++;api.sfx('point');this.serve(-1)}
    const R=vsAI?'CPU':'P2';api.status(`P1 ${this.s[0]} — ${this.s[1]} ${R}`);
    if(Math.max(...this.s)>=7){const p1=this.s[0]>this.s[1];api.over(p1?'PLAYER 1 WINS':(vsAI?'CPU WINS':'PLAYER 2 WINS'),`${this.s[0]} – ${this.s[1]}`,vsAI&&p1?{key:'paddle',val:this.s[0]-this.s[1],label:'margin'}:null)}},
  draw(g){g.fillStyle='#05060f';g.fillRect(0,0,W,H);for(let y=8;y<H;y+=28)glowRect(g,W/2-3,y,6,14,'rgba(169,139,255,.6)',6);
    txt(g,String(this.s[0]),W/2-90,60,40,'rgba(62,232,255,.5)');txt(g,String(this.s[1]),W/2+90,60,40,'rgba(255,79,179,.5)');
    glowRect(g,30,this.p1,this.PW,this.PH,C.cyan,18);glowRect(g,W-30-this.PW,this.p2,this.PW,this.PH,C.pink,18);
    this.trail.forEach(([x,y],i)=>{g.fillStyle=`rgba(255,255,255,${i/30})`;g.fillRect(x+3,y+3,this.BS-6,this.BS-6)});glowRect(g,this.bx,this.by,this.BS,this.BS,'#fff',16)},
  pointer(t,x,y){if(vsAI)this.ptr=t==='up'?null:y}
}}
G.paddle=paddleBall(true);G.paddle2=paddleBall(false);

/* ---------- Star Sweeper ---------- */
G.stars={title:'Star Sweeper',color:C.red,keys:['← → or A D','Space to fire','Touch: drag + auto-fire'],desc:'Clear the descending drone fleet wave after wave. Three lives.',
  init(){this.x=W/2-23;this.lives=3;this.score=0;this.wave=1;this.b=[];this.eb=[];this.cd=0;this.inv=0;this.fx=[];this.sky=Array.from({length:90},()=>[rnd(0,W),rnd(0,H),rnd(.3,1.6)]);this.spawn()},
  spawn(){this.e=[];for(let r=0;r<4;r++)for(let c=0;c<8;c++)this.e.push({x:60+c*80,y:60+r*50,a:1,t:r});this.dir=1;this.spd=1.2+.3*(this.wave-1);this.fire=.02+.005*(this.wave-1)},
  step(k,api){this.sky.forEach(s=>{s[1]+=s[2];if(s[1]>H)s[1]=0});if(this.cd>0)this.cd--;if(this.inv>0)this.inv--;
    let mv=0;if(k.has('ArrowLeft')||k.has('KeyA'))mv=-1;if(k.has('ArrowRight')||k.has('KeyD'))mv=1;this.x+=mv*8;if(this.ptr!=null)this.x+=(this.ptr-23-this.x)*.3;this.x=clamp(this.x,10,W-56);
    if((k.has('Space')||this.ptr!=null)&&this.cd===0){this.b.push([this.x+21,H-62]);this.cd=this.ptr!=null?12:8;api.sfx('shoot')}
    this.b.forEach(b=>b[1]-=10);this.b=this.b.filter(b=>b[1]>-14);this.eb.forEach(b=>b[1]+=6);this.eb=this.eb.filter(b=>b[1]<H+14);
    const al=this.e.filter(e=>e.a);if(al.length){const mn=Math.min(...al.map(e=>e.x)),mx=Math.max(...al.map(e=>e.x));
      if((mx+30>=W-10&&this.dir>0)||(mn-30<=10&&this.dir<0)){this.dir*=-1;al.forEach(e=>e.y+=18)}
      al.forEach(e=>{e.x+=this.dir*this.spd;if(Math.random()<this.fire/al.length*3)this.eb.push([e.x+14,e.y+20])})}
    for(const b of this.b)for(const e of al)if(e.a&&b[0]>e.x-2&&b[0]<e.x+32&&b[1]>e.y-6&&b[1]<e.y+22){e.a=0;b[1]=-99;this.score+=10*(4-e.t);api.sfx('boom');for(let i=0;i<12;i++)this.fx.push({x:e.x+14,y:e.y+9,vx:rnd(-3,3),vy:rnd(-3,3),l:1,c:pick([C.red,C.amber,C.pink])});break}
    if(this.inv===0)for(const b of this.eb)if(b[0]>this.x&&b[0]<this.x+46&&b[1]>H-62&&b[1]<H-34){b[1]=H+99;this.lives--;this.inv=60;api.sfx('hurt');if(this.lives<=0)return this.end(api)}
    if(this.e.some(e=>e.a&&e.y+20>=H-62))return this.end(api);
    if(!this.e.some(e=>e.a)){this.wave++;this.spawn();api.sfx('point')}
    this.fx.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l-=.03});this.fx=this.fx.filter(p=>p.l>0);
    api.status(`SCORE ${this.score}  LIVES ${this.lives}  WAVE ${this.wave}`)},
  end(api){api.over('GAME OVER',`Score ${this.score} · wave ${this.wave}`,{key:'stars',val:this.score,label:'pts'})},
  draw(g){g.fillStyle='#02030a';g.fillRect(0,0,W,H);this.sky.forEach(([x,y,s])=>{g.fillStyle=`rgba(200,210,255,${s/2})`;g.fillRect(x,y,s,s)});
    this.e.forEach(e=>{if(!e.a)return;const col=[C.pink,C.red,C.amber,C.violet][e.t];g.save();g.shadowColor=col;g.shadowBlur=10;g.fillStyle=col;g.fillRect(e.x,e.y,28,16);g.fillStyle='#02030a';g.fillRect(e.x+6,e.y+5,5,5);g.fillRect(e.x+17,e.y+5,5,5);
      g.fillStyle=col;for(let i=0;i<4;i++){g.fillRect(e.x+2+i*7,e.y-5,3,5);g.fillRect(e.x+2+i*7,e.y+16,3,5)}g.restore()});

cv.addEventListener('pointermove',e=>{if(state!=='play'||!cur.pointer)return;if(e.pointerType==='mouse'&&e.buttons===0&&!['paddle','bricks','four'].includes(curId))return;const [x,y]=toL(e);cur.pointer('move',x,y,api)});
cv.addEventListener('pointerup',e=>{if(state!=='play'||!cur.pointer)return;const [x,y]=toL(e);cur.pointer('up',x,y,api)});
cv.addEventListener('pointerleave',e=>{if(state==='play'&&cur&&cur.pointer&&e.pointerType==='mouse'&&['paddle','bricks'].includes(curId))cur.pointer('up',0,0,api)});
cv.tabIndex=0;addEventListener('resize',()=>{if(!$('#vGame').hidden)fit()});
requestAnimationFrame(t=>{last=t;loop(t)});
const h=location.hash.slice(1);if(G[h])openGame(h);else show('home');
addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(G[id]&&id!==curId)openGame(id)});
})();
</script>
</body>
</html>
