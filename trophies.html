<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Lucas Chiang's trophy case: achievements hidden around the site.">
<title>LC Trophy Case</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@500;700&family=Figtree:wght@400;600;700&display=swap">
<style>
/* A lit glass trophy case in a dark room: velvet back, glass shelves, gold for what you've earned. */
:root{--bg:#07070c;--velvet:#1a0f1f;--glass:rgba(160,200,255,.08);--fg:#f0eef8;--muted:#9a96b0;--gold:#ffc23e;--line:#2c2638;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Figtree",system-ui,sans-serif;min-height:100%}
body{background:radial-gradient(ellipse at 50% -20%,rgba(255,194,62,.16),transparent 55%),var(--bg)}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 40px}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top .sp{flex:1}
.lnk{display:inline-flex;align-items:center;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:4px;text-decoration:none;font:500 .76rem "JetBrains Mono",monospace;color:var(--muted)}
.lnk:hover{color:var(--fg);border-color:var(--gold)}
h1{margin:30px 0 6px;text-align:center;font:400 clamp(1.3rem,4.6vw,2.4rem)/1.3 "Press Start 2P",monospace;color:var(--gold);text-shadow:0 0 18px rgba(255,194,62,.45),3px 3px 0 #3a2a08}
.sub{text-align:center;color:var(--muted);font:500 .8rem "JetBrains Mono",monospace;letter-spacing:.06em;margin:0}
.prog{display:flex;align-items:center;gap:12px;justify-content:center;margin:18px 0 26px}
.bar{width:min(320px,60vw);height:10px;border-radius:5px;background:#1d1a26;overflow:hidden;box-shadow:inset 0 0 0 1px #2c2638}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b37a12,#ffc23e,#fff3b0);box-shadow:0 0 12px rgba(255,194,62,.6)}
.prog b{font:700 .9rem "JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.case{position:relative;border-radius:14px;padding:22px 18px 8px;background:linear-gradient(180deg,#22142a,var(--velvet) 40%,#120a16);box-shadow:inset 0 0 0 2px #3a2a44,inset 0 30px 60px rgba(255,194,62,.08),0 30px 80px rgba(0,0,0,.6)}
.case::before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,transparent 30%,transparent 60%,rgba(255,255,255,.04) 70%,transparent 80%)}
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:6px 6px 20px;margin-bottom:16px;position:relative}
.shelf::after{content:"";position:absolute;left:-6px;right:-6px;bottom:4px;height:10px;border-radius:2px;background:linear-gradient(180deg,rgba(200,230,255,.35),rgba(200,230,255,.06));box-shadow:0 8px 16px rgba(0,0,0,.6)}
@media (max-width:820px){.shelf{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.shelf{grid-template-columns:1fr}}
.ach{display:flex;gap:14px;align-items:center;padding:14px;border-radius:8px;background:var(--glass);border:1px solid rgba(255,255,255,.08);min-width:0}
.ach .ic{flex:none;width:64px;height:64px;display:grid;place-items:center;border-radius:6px;background:radial-gradient(circle,#3a3220,#16130e);border:1px solid #5a4a24;box-shadow:0 0 20px rgba(255,194,62,.3)}
.ach .tx{min-width:0}
.ach b{display:block;font:700 1rem/1.25 "Figtree",sans-serif}
.ach span{display:block;font-size:.84rem;color:#c4c0d8;margin-top:2px}
.ach small{display:block;font:500 .66rem "JetBrains Mono",monospace;color:var(--gold);margin-top:6px;letter-spacing:.05em}
.ach.locked{opacity:.42;filter:saturate(.3)}
.ach.locked .ic{background:#15141c;border-color:#2c2a36;box-shadow:none}
.ach.locked b{font:400 .8rem "Press Start 2P",monospace;letter-spacing:.2em;color:#cfcbe0}
.ach.locked span{letter-spacing:.3em}
.foot{text-align:center;margin-top:26px;color:#5f5a74;font:500 .72rem "JetBrains Mono",monospace}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="lnk" href="arcade.html">LC Arcade</a><span class="sp"></span><a class="lnk" href="board.html">3D Board</a><a class="lnk" href="fun.html">Fun site</a><a class="lnk" href="index.html">Classic site</a></div>
  <h1>TROPHY CASE</h1>
  <p class="sub">Achievements hidden around lucaschiang.com</p>
  <div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum">0 / 0</b></div>
  <div class="case" id="case"></div>
  <p class="foot">Saved in this browser · more trophies will be added over time</p>
</div>
<script src="achievements.js"></script>
<script>
(function(){
  const A=window.LCAch,box=document.getElementById('case');
  function render(){box.innerHTML='';const list=A.LIST;let shelf;
    list.forEach((a,i)=>{if(i%3===0){shelf=document.createElement('div');shelf.className='shelf';box.appendChild(shelf)}
      const on=A.has(a.id),el=document.createElement('div');el.className='ach'+(on?'':' locked');
      const ic=document.createElement('div');ic.className='ic';ic.appendChild(A.trophy(44,!on));el.appendChild(ic);
      const tx=document.createElement('div');tx.className='tx';
      if(on){const d=new Date(A.when(a.id));tx.innerHTML=`<b></b><span></span><small>Unlocked ${d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</small>`;tx.querySelector('b').textContent=a.t;tx.querySelector('span').textContent=a.d}
      else tx.innerHTML='<b>???</b><span>???</span>';
      el.setAttribute('aria-label',on?`${a.t}: ${a.d}`:'Locked achievement');el.appendChild(tx);shelf.appendChild(el)});
    const n=A.count();document.getElementById('pnum').textContent=`${n} / ${A.total}`;document.getElementById('pbar').style.width=(n/A.total*100)+'%'}
  render();A.onUnlock(render);
})();
</script>
</body>
</html>
